[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repoatlas"
version = "0.1.0"
description = "Graph-enhanced repository intelligence and safe coding agent"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "numpy>=2.0",
  "networkx>=3.3",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "qdrant-client>=1.12",
  "sentence-transformers>=3.3",
  "transformers>=4.51",
  "langgraph>=0.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gradio>=5.0",
  "sqlalchemy>=2.0",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "mcp>=2,<3",
]

[project.optional-dependencies]
gpu = ["torch>=2.7"]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.9", "mypy>=1.14", "bandit>=1.8"]
commercial = ["openai>=1.60", "anthropic>=0.45", "google-genai>=1.0"]

[project.scripts]
repoatlas = "repoatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
